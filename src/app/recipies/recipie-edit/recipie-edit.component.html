<div class="row">
  <div class="col-12">
    <form [formGroup]="recipieForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-12">
          <button
            type="submit"
            class="btn btn-success"
            [disabled]="!recipieForm.valid"
          >
            Save
          </button>
          <button type="button" class="btn btn-danger mx-2" routerLink="../">
            Cancel
          </button>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-12">
          <div class="form-group">
            <label for="name">name</label>
            <input
              type="text"
              id="name"
              class="form-control"
              formControlName="name"
              ]
            />
          </div>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-12">
          <div class="form-group">
            <label for="imagepath">imagePath</label>
            <input
              type="text"
              id="imagepath"
              class="form-control"
              formControlName="imagePath"
              #imagePath
            />
          </div>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-12">
          <img [src]="imagePath.value" width="500px" />
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-12">
          <div class="form-group">
            <label for="description">description</label>
            <textarea
              type="text"
              id="description"
              class="form-control"
              rows="6"
              formControlName="description"
            ></textarea>
          </div>
        </div>
      </div>

      <div class="mt-3" formArrayName="ingredients">
        <div
          class="row mt-3"
          *ngFor="let ingredient of ingredients; let i = index"
          [formGroupName]="i"
        >
          <div class="col-7">
            <input type="text" class="form-control" formControlName="name" />
          </div>
          <div class="col-2">
            <input
              type="number"
              class="form-control"
              formControlName="amount"
            />
          </div>
          <div class="col-2">
            <button
              class="btn btn-danger"
              type="button"
              (click)="removeIngredient(i)"
            >
              X
            </button>
          </div>
        </div>
      </div>
      <hr />
      <button type="button" class="btn btn-success" (click)="addIngredient()">
        add ingredient
      </button>
    </form>
  </div>
</div>
